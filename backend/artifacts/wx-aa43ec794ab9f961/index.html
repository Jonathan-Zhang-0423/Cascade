<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07c160">
<title>WeChat Mini Program Preview</title>
<style>
@keyframes wx-spin { to { transform: rotate(360deg); } }
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: rgba(0, 0, 0, 0.1); }
html, body, #root {
  height: 100%;
  overflow: hidden;
  background: #f5f5f5;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", "Hiragino Sans GB", Helvetica, Arial, sans-serif;
  font-size: 14px;
  color: #1a1a1a;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}
/* WeChat's characteristic long-press + selection suppression on non-text UI */
button, [role="button"], .wx-tap-area {
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
}
/* Native-feel momentum scroll inside scroll containers */
.wx-scroll { -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
</style>
<style id="__wx_styles__">
#__wx_page__ {
  background-color: #f5f5f5;
  font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
}
.wx-page-pages-index-index .game-container {

  position: relative;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background: linear-gradient(180deg, #4FC3F7 0%, #81D4FA 60%, #B3E5FC 100%);
}

.wx-page-pages-index-index .game-canvas {

  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 1;
}

.wx-page-pages-index-index .ui-layer {

  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 10;
  pointer-events: none;
}

.wx-page-pages-index-index .score-board {

  position: absolute;
  top: 10.667vw;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  pointer-events: none;
}

.wx-page-pages-index-index .score-text {

  font-size: 16.000vw;
  font-weight: bold;
  color: #ffffff;
  text-shadow: 0.533vw 0.533vw 1.067vw rgba(0, 0, 0, 0.3);
  font-family: Arial, sans-serif;
}

.wx-page-pages-index-index .start-screen {

  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  pointer-events: auto;
}

.wx-page-pages-index-index .game-title {

  font-size: 10.667vw;
  font-weight: bold;
  color: #ffffff;
  text-shadow: 0.533vw 0.533vw 1.067vw rgba(0, 0, 0, 0.4);
  margin-bottom: 2.667vw;
}

.wx-page-pages-index-index .game-subtitle {

  font-size: 5.333vw;
  color: #ffffff;
  margin-bottom: 8.000vw;
  text-shadow: 0.267vw 0.267vw 0.533vw rgba(0, 0, 0, 0.3);
}

.wx-page-pages-index-index .bird-icon {

  font-size: 16.000vw;
  margin-bottom: 5.333vw;
  animation: float 1.5s ease-in-out infinite;
}

@keyframes float {

  0%, 100% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(-2.667vw);
  }
}

.wx-page-pages-index-index .start-tip {

  font-size: 4.267vw;
  color: #ffffff;
  margin-bottom: 2.667vw;
  text-shadow: 0.267vw 0.267vw 0.533vw rgba(0, 0, 0, 0.3);
}

.wx-page-pages-index-index .tap-hint {

  font-size: 3.733vw;
  color: #E3F2FD;
  margin-bottom: 8.000vw;
}

.wx-page-pages-index-index .start-btn {

  width: 42.667vw;
  height: 13.333vw;
  line-height: 13.333vw;
  background: linear-gradient(180deg, #FFEB3B 0%, #FFC107 100%);
  color: #5D4037;
  font-size: 5.333vw;
  font-weight: bold;
  border-radius: 6.667vw;
  border: 0.533vw solid #FF9800;
  box-shadow: 0 1.067vw 0 #E65100, 0 2.133vw 2.667vw rgba(0, 0, 0, 0.3);
  text-align: center;
  pointer-events: auto;
  transition: all 0.1s;
}

.wx-page-pages-index-index .start-btn:active {

  transform: translateY(1.067vw);
  box-shadow: 0 0 0 #E65100, 0 1.067vw 2.667vw rgba(0, 0, 0, 0.3);
}

.wx-page-pages-index-index .game-over-screen {

  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  pointer-events: auto;
}

.wx-page-pages-index-index .over-title {

  font-size: 9.600vw;
  font-weight: bold;
  color: #ffffff;
  text-shadow: 0.533vw 0.533vw 1.067vw rgba(0, 0, 0, 0.4);
  margin-bottom: 5.333vw;
}

.wx-page-pages-index-index .score-card {

  background: linear-gradient(180deg, #ffffff 0%, #f5f5f5 100%);
  border-radius: 2.667vw;
  padding: 5.333vw 8.000vw;
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: center;
  margin-bottom: 5.333vw;
  box-shadow: 0 1.067vw 4.000vw rgba(0, 0, 0, 0.3);
  border: 0.533vw solid #FF9800;
}

.wx-page-pages-index-index .score-item {

  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 5.333vw;
}

.wx-page-pages-index-index .score-label {

  font-size: 3.733vw;
  color: #666666;
  margin-bottom: 2.133vw;
}

.wx-page-pages-index-index .score-value {

  font-size: 8.533vw;
  font-weight: bold;
}

.wx-page-pages-index-index .current-score {

  color: #FF5722;
}

.wx-page-pages-index-index .best-score {

  color: #4CAF50;
}

.wx-page-pages-index-index .score-divider {

  width: 0.267vw;
  height: 10.667vw;
  background-color: #dddddd;
}

.wx-page-pages-index-index .new-record {

  font-size: 5.333vw;
  color: #FFEB3B;
  font-weight: bold;
  text-shadow: 0.267vw 0.267vw 0.533vw rgba(0, 0, 0, 0.3);
  margin-bottom: 5.333vw;
  animation: pulse 0.8s ease-in-out infinite;
}

@keyframes pulse {

  0%, 100% {
    transform: scale(1);
  }
  50% {
    transform: scale(1.1);
  }
}

.wx-page-pages-index-index .restart-btn {

  width: 42.667vw;
  height: 13.333vw;
  line-height: 13.333vw;
  background: linear-gradient(180deg, #81C784 0%, #4CAF50 100%);
  color: #ffffff;
  font-size: 5.333vw;
  font-weight: bold;
  border-radius: 6.667vw;
  border: 0.533vw solid #388E3C;
  box-shadow: 0 1.067vw 0 #2E7D32, 0 2.133vw 2.667vw rgba(0, 0, 0, 0.3);
  text-align: center;
  margin-bottom: 4.000vw;
  pointer-events: auto;
  transition: all 0.1s;
}

.wx-page-pages-index-index .restart-btn:active {

  transform: translateY(1.067vw);
  box-shadow: 0 0 0 #2E7D32, 0 1.067vw 2.667vw rgba(0, 0, 0, 0.3);
}

.wx-page-pages-index-index .back-tip {

  font-size: 3.200vw;
  color: #E3F2FD;
}
</style>
</head>
<body>
<div id="root"></div>
<script src="./bundle.js"></script>
</body>
</html>
